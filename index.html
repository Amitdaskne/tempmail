<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>AMIT // TEMPMAIL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --black:#050505;
    --panel:#0b0b0b;
    --white:#f5f5f5;
    --gray:#777;
    --red:#ff1f1f;
    --green:#00ff88;
}


/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
}

body{
    color:var(--white);
    font-family:"Share Tech Mono",monospace;
    overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    opacity:.2;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:min(100%,520px);
    margin:auto;
    padding:15px 14px 80px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:relative;

    padding:20px 16px;
    margin-bottom:12px;

    background:
        linear-gradient(
            145deg,
            #0c0c0c,
            #070707
        );

    border:1px solid rgba(255,31,31,.4);

    box-shadow:
        inset 0 0 25px rgba(255,31,31,.025),
        0 0 25px rgba(0,0,0,.7);

    clip-path:polygon(
        0 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        18px 100%,
        0 calc(100% - 18px)
    );
}

.header::after{
    content:"";

    position:absolute;
    right:0;
    top:0;

    width:80px;
    height:2px;

    background:var(--red);

    box-shadow:
        0 0 10px rgba(255,31,31,.7);
}

.header-line{
    height:2px;
    width:100%;
    margin-bottom:14px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );
}


/* =====================================================
   BRAND
===================================================== */

.brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-family:"Orbitron",sans-serif;
    font-weight:900;
    font-size:24px;
    letter-spacing:2px;
    color:#fff;
    white-space:nowrap;

    text-shadow:
        0 0 8px rgba(255,31,31,.35);
}

.logo span{
    color:var(--red);
}


/* =====================================================
   CONNECTION
===================================================== */

.connection{
    display:flex;
    align-items:center;
    gap:7px;

    flex-shrink:0;

    padding:6px 8px;

    border:1px solid rgba(255,255,255,.08);

    background:#080808;
}

.connection-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--red);

    box-shadow:
        0 0 8px rgba(255,31,31,.7);
}

.connection-text{
    font-family:"Orbitron",sans-serif;

    font-size:7px;
    letter-spacing:1px;

    color:var(--red);
}

.header.connected .connection-dot{
    background:var(--green);

    box-shadow:
        0 0 8px rgba(0,255,136,.8);
}

.header.connected .connection-text{
    color:var(--green);
}

.header.disconnected .connection-dot{
    animation:
        connectionPulse
        1s
        infinite;
}

@keyframes connectionPulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

    100%{
        opacity:1;
    }

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{
    margin-top:7px;

    color:#666;

    font-size:9px;
    letter-spacing:2px;
}

.subtitle-status{
    color:#555;
}

.header.connected .subtitle-status{
    color:var(--green);

    text-shadow:
        0 0 6px rgba(0,255,136,.3);
}

.header.disconnected .subtitle-status{
    color:var(--red);
}


/* =====================================================
   PANELS
===================================================== */

.panel{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(15,15,15,.98),
            rgba(8,8,8,.98)
        );

    border:1px solid rgba(255,255,255,.07);

    margin-bottom:11px;
    padding:15px;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.012),
        0 5px 20px rgba(0,0,0,.5);

    clip-path:polygon(
        0 0,
        calc(100% - 12px) 0,
        100% 12px,
        100% 100%,
        12px 100%,
        0 calc(100% - 12px)
    );
}

.panel::before{
    content:"";

    position:absolute;
    left:16px;
    top:-1px;

    width:35px;
    height:2px;

    background:var(--red);

    box-shadow:
        0 0 8px rgba(255,31,31,.5);
}

.panel-title{
    font-family:"Orbitron",sans-serif;

    font-size:9px;
    color:#777;
    letter-spacing:2px;

    margin-bottom:12px;
}


/* =====================================================
   BUTTONS
===================================================== */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.cyber-btn{
    min-height:45px;

    padding:10px;

    background:#0a0a0a;

    border:1px solid rgba(255,255,255,.16);

    color:#eee;

    font-family:"Orbitron",sans-serif;

    font-size:9px;
    font-weight:700;
    letter-spacing:1px;

    cursor:pointer;

    transition:.18s;

    clip-path:polygon(
        0 0,
        calc(100% - 9px) 0,
        100% 9px,
        100% 100%,
        9px 100%,
        0 calc(100% - 9px)
    );
}

.cyber-btn:hover{
    border-color:var(--red);
    background:#110707;

    box-shadow:
        0 0 15px rgba(255,31,31,.12);
}

.cyber-btn:active{
    transform:scale(.97);
}

.cyber-btn.red{
    border-color:rgba(255,31,31,.6);
    color:var(--red);
}

.cyber-btn.green{
    border-color:rgba(0,255,136,.5);
    color:var(--green);
}

.refresh{
    width:100%;
}


/* =====================================================
   EMAIL
===================================================== */

.email-box{
    display:flex;
    align-items:center;
    gap:11px;
}

.email-icon{
    width:45px;
    height:45px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,31,31,.55);

    color:var(--red);
}

.email-icon svg{
    width:22px;
    height:22px;
}

.email-content{
    min-width:0;
    flex:1;
}

.email-label{
    color:#555;

    font-size:8px;
    letter-spacing:2px;

    margin-bottom:5px;
}


/* =====================================================
   FAST EMAIL FLICKER
===================================================== */

.email-address{
    min-height:22px;

    color:#fff;

    font-size:14px;
    line-height:1.5;

    word-break:break-all;

    text-shadow:
        0 0 6px rgba(255,31,31,.25);
}

.email-address.flicker{
    animation:
        fastCyberFlicker
        1.35s
        linear
        infinite;
}

@keyframes fastCyberFlicker{

    0%{
        opacity:1;
        text-shadow:
            0 0 6px rgba(255,31,31,.15);
    }

    3%{
        opacity:.72;
    }

    5%{
        opacity:1;
    }

    14%{
        opacity:.35;

        text-shadow:
            0 0 18px rgba(255,31,31,1);
    }

    15%{
        opacity:1;
    }

    23%{
        opacity:.78;
    }

    24%{
        opacity:1;
    }

    38%{
        opacity:.42;

        text-shadow:
            0 0 20px rgba(255,31,31,1);
    }

    39%{
        opacity:1;
    }

    54%{
        opacity:.68;
    }

    55%{
        opacity:1;
    }

    68%{
        opacity:.32;

        text-shadow:
            0 0 22px rgba(255,31,31,1);
    }

    69%{
        opacity:1;
    }

    83%{
        opacity:.65;
    }

    84%{
        opacity:1;
    }

    93%{
        opacity:.38;
    }

    94%{
        opacity:1;
    }

    100%{
        opacity:1;
    }

}


/* =====================================================
   COPY
===================================================== */

.copy-btn{
    flex-shrink:0;

    width:52px;
    height:40px;

    background:#0b0b0b;

    border:1px solid rgba(255,31,31,.55);

    color:var(--red);

    font-family:"Orbitron",sans-serif;

    font-size:7px;

    cursor:pointer;
}


/* =====================================================
   TIMER
===================================================== */

.timer-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.timer-label{
    color:#555;

    font-size:8px;
    letter-spacing:2px;
}

.timer{
    margin-top:5px;

    font-family:"Orbitron",sans-serif;

    font-size:28px;

    color:#fff;

    letter-spacing:1px;
}

.timer-btn{
    padding:11px 15px;

    border:1px solid rgba(255,31,31,.6);

    background:#0a0a0a;

    color:var(--red);

    font-family:"Orbitron",sans-serif;

    font-size:8px;

    cursor:pointer;
}

.timer-btn:active{
    transform:scale(.95);
}


/* =====================================================
   OTP
===================================================== */

.otp{
    border-color:rgba(0,255,136,.3);
}

.otp-code{
    font-family:"Orbitron",sans-serif;

    font-size:27px;

    color:var(--green);

    letter-spacing:5px;

    text-shadow:
        0 0 8px rgba(0,255,136,.3);
}

.status-sub{
    margin-top:6px;

    color:#555;

    font-size:8px;
}


/* =====================================================
   INBOX
===================================================== */

.inbox-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:11px;
}

.inbox-title{
    font-family:"Orbitron",sans-serif;

    font-size:13px;
    letter-spacing:2px;
}

.count{
    color:var(--red);

    font-size:8px;
}

.mail-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.mail-card{
    position:relative;

    padding:12px;

    border:1px solid rgba(255,255,255,.07);

    background:#090909;

    cursor:pointer;

    transition:.18s;
}

.mail-card:hover{
    border-color:rgba(255,31,31,.5);

    background:#0d0808;

    transform:translateX(2px);
}

.mail-card::after{
    content:"";

    position:absolute;

    right:0;
    top:0;

    width:2px;
    height:100%;

    background:var(--red);
}

.mail-top{
    display:flex;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,31,31,.4);

    color:var(--red);

    font-family:"Orbitron",sans-serif;

    font-size:11px;
}

.mail-info{
    min-width:0;
    flex:1;
}

.mail-subject{
    font-family:"Orbitron",sans-serif;

    font-size:9px;

    color:#eee;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mail-from{
    margin-top:5px;

    color:#999;

    font-size:8px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mail-intro{
    margin-top:5px;

    color:#555;

    font-size:8px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mail-date{
    margin-top:6px;

    color:#3d3d3d;

    font-size:7px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;

    padding:45px 10px;

    color:#444;
}

.empty svg{
    width:62px;
    height:62px;

    color:#4b4b4b;

    margin-bottom:12px;
}

.empty-title{
    font-family:"Orbitron",sans-serif;

    font-size:9px;

    color:#555;
}

.empty-sub{
    margin-top:6px;

    font-size:7px;

    color:#3d3d3d;
}


/* =====================================================
   EMAIL VIEW
===================================================== */

.email-view{
    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    background:#050505;

    overflow-y:auto;
}

.email-view.active{
    display:block;
}

.email-view-inner{
    width:min(100%,520px);

    margin:auto;

    padding:15px 14px 50px;
}

.back-btn{
    width:44px;
    height:42px;

    margin-bottom:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,31,31,.5);

    background:#090909;

    color:var(--red);

    cursor:pointer;
}

.detail{
    padding:16px;

    background:#0a0a0a;

    border:1px solid rgba(255,31,31,.35);
}

.detail-header{
    display:flex;
    align-items:center;

    gap:11px;

    margin-bottom:18px;
}

.detail-avatar{
    width:48px;
    height:48px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,31,31,.5);

    color:var(--red);

    font-family:"Orbitron",sans-serif;
}

.detail-sender{
    color:#ddd;

    font-size:9px;

    word-break:break-all;
}

.detail-time{
    margin-top:5px;

    color:#555;

    font-size:7px;
}

.detail-subject{
    margin-bottom:15px;

    color:white;

    font-family:"Orbitron",sans-serif;

    font-size:16px;

    line-height:1.5;
}


/* =====================================================
   EMAIL BODY
===================================================== */

.email-body{
    background:#fff;

    color:#000;

    overflow:hidden;
}


/*
 * IMPORTANT
 *
 * sandbox WITHOUT allow-popups would prevent
 * target=_blank.
 *
 * We therefore use a normal iframe and sanitize
 * the HTML ourselves before injecting it.
 */

.email-frame{
    display:block;

    width:100%;

    min-height:420px;

    border:0;

    background:#fff;
}


.text-body{
    min-height:200px;

    padding:15px;

    background:#0c0c0c;

    color:#ddd;

    white-space:pre-wrap;

    word-break:break-word;

    font-size:10px;

    line-height:1.6;
}


.remove-btn{
    width:100%;

    margin-top:14px;

    padding:12px;

    border:1px solid rgba(255,31,31,.5);

    background:#0a0a0a;

    color:var(--red);

    font-family:"Orbitron",sans-serif;

    font-size:8px;
}


/* =====================================================
   TOAST
===================================================== */

.toast-container{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:1000;

    width:max-content;

    max-width:90%;
}

.toast{
    padding:11px 15px;

    border:1px solid rgba(255,31,31,.6);

    background:#080808;

    color:#fff;

    font-size:8px;

    box-shadow:
        0 0 18px rgba(255,31,31,.15);

    animation:
        toastIn .3s ease;
}

@keyframes toastIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   SPLASH
===================================================== */

.splash{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#050505;
}

.splash.hide{
    animation:
        splashOut .6s forwards;
}

@keyframes splashOut{

    to{
        opacity:0;
        visibility:hidden;
    }

}

.splash-svg{
    width:105px;
    height:105px;

    margin-bottom:20px;
}

.splash-title{
    font-family:"Orbitron",sans-serif;

    font-size:21px;

    font-weight:900;

    letter-spacing:3px;

    color:white;
}

.splash-title span{
    color:var(--red);
}

.splash-sub{
    margin-top:7px;

    color:#555;

    font-size:7px;

    letter-spacing:3px;
}

.progress{
    width:230px;
    height:2px;

    margin-top:24px;

    background:#1a1a1a;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    background:var(--red);

    box-shadow:
        0 0 10px rgba(255,31,31,.7);

    transition:.2s;
}


/* =====================================================
   SVG
===================================================== */

svg{
    fill:none;

    stroke:currentColor;

    stroke-width:1.6;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

    .logo{
        font-size:20px;
    }

    .connection{
        padding:5px 6px;
    }

    .connection-text{
        font-size:6px;
    }

    .subtitle{
        font-size:8px;
    }

    .email-address{
        font-size:12px;
    }

    .timer{
        font-size:23px;
    }

}

@media(max-width:350px){

    .brand-row{
        align-items:flex-start;

        flex-direction:column;
    }

    .connection{
        align-self:flex-end;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splash" class="splash">

    <svg
        class="splash-svg"
        viewBox="0 0 100 100">

        <polygon
            points="50,5 92,28 92,72 50,95 8,72 8,28"
            stroke="#ff1f1f"/>

        <polygon
            points="50,20 78,35 78,65 50,80 22,65 22,35"
            stroke="#777"/>

        <rect
            x="37"
            y="37"
            width="26"
            height="26"
            stroke="#fff"/>

        <path d="M50 30V37"/>
        <path d="M50 63V70"/>
        <path d="M30 50H37"/>
        <path d="M63 50H70"/>

        <circle
            cx="50"
            cy="50"
            r="5"
            fill="#ff1f1f"
            stroke="none"/>

    </svg>


    <div class="splash-title">

        AMIT
        <span>//</span>
        TEMPMAIL

    </div>


    <div class="splash-sub">

        SECURE MAIL TERMINAL

    </div>


    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


<header
    id="header"
    class="header disconnected">


    <div class="header-line"></div>


    <div class="brand-row">


        <div class="logo">

            AMIT
            <span>//</span>
            TEMPMAIL

        </div>


        <div class="connection">

            <span
                class="connection-dot">
            </span>

            <span
                id="connectionText"
                class="connection-text">

                OFFLINE

            </span>

        </div>


    </div>


    <div class="subtitle">

        TEMPORARY MAIL //

        <span
            id="subtitleStatus"
            class="subtitle-status">

            NETWORK OFFLINE

        </span>

    </div>


</header>


<!-- =====================================================
     MAILBOX CONTROL
===================================================== -->

<div class="panel">

    <div class="panel-title">

        // MAILBOX CONTROL

    </div>


    <div class="actions">


        <button
            id="newMailBtn"
            class="cyber-btn">

            CHANGE MAIL

        </button>


        <button
            id="clearBtn"
            class="cyber-btn red">

            CLEAR INBOX

        </button>


    </div>

</div>


<!-- =====================================================
     ACTIVE EMAIL
===================================================== -->

<div class="panel">


    <div class="panel-title">

        // ACTIVE ADDRESS

    </div>


    <div class="email-box">


        <div class="email-icon">

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"/>

                <path
                    d="M3 7l9 6 9-6"/>

            </svg>

        </div>


        <div class="email-content">


            <div class="email-label">

                TEMPORARY EMAIL

            </div>


            <div
                id="emailText"
                class="email-address">

                GENERATING...

            </div>


        </div>


        <button
            id="copyBtn"
            class="copy-btn">

            COPY

        </button>


    </div>

</div>


<!-- =====================================================
     TIMER
===================================================== -->

<div class="panel">


    <div class="timer-wrap">


        <div>

            <div class="timer-label">

                MAILBOX LIFETIME

            </div>


            <div
                id="timer"
                class="timer">

                05:00

            </div>

        </div>


        <button
            id="extendBtn"
            class="timer-btn">

            EXTEND

        </button>


    </div>

</div>


<!-- =====================================================
     OTP
===================================================== -->

<div
    id="otpPanel"
    class="panel otp"
    style="display:none;">

    <div class="panel-title">

        // VERIFICATION CODE

    </div>


    <div
        id="otpCode"
        class="otp-code">

/* =====================================================

/* =====================================================
   STATE
===================================================== */

let currentEmail = "";
let token = "";

/* =====================================================

function setConnection(

/* =====================================================
   FETCH
===================================================== */

async function apiFetch(
    url,
    options = {},
    timeout = 15000
){

    const controller =
        new AbortController();

    const timeoutId =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try{

        return await fetch(
            url,
            {
                ...options,
                signal:
                    controller.signal
            }
        );

    }

    finally{

        clearTimeout(
            timeoutId
        );

    }

}


/* =====================================================
   JSON
===================================================== */

async function readJSON(
    response
){

    const text =
        await response.text();

    if(!text){

        return {};

    }

    try{

        return JSON.parse(
            text
        );

    }

    catch{

        return {
            raw:text
        };

    }

}


/* =====================================================
   API ERROR
===================================================== */

function apiError(
    data,
    status
){

    return (
        data?.error ||
        data?.message ||
        `REQUEST FAILED // ${status}`
    );

}


/* =====================================================
   DOMAINS
===================================================== */

async function getDomains(){

    const response =
        await apiFetch(
            `${API}/api/domains`
        );

    const data =
        await readJSON(
            response
        );

    if(!response.ok){

        throw new Error(
            apiError(
                data,
                response.status
            )
        );

    }

    if(
        !Array.isArray(data) ||
        !data.length
    ){

        throw new Error(
            "NO MAIL DOMAIN AVAILABLE"
        );

    }

    return data;

}


/* =====================================================
   LOGIN
===================================================== */

function generateLogin(){

    if(
        window.crypto &&
        crypto.randomUUID
    ){

        return (
            "amit" +
            crypto
                .randomUUID()
                .replaceAll(
                    "-",
                    ""
                )
                .substring(
                    0,
                    9
                )
        );

    }

    return (
        "amit" +
        Math.random()
            .toString(36)
            .substring(
                2,
                11
            )
    );

}


/* =====================================================
   CREATE INBOX
===================================================== */

async function createInbox(){

    if(busy){

        return;

    }

    busy = true;

    const button =
        document.getElementById(
            "newMailBtn"
        );

    button.disabled =
        true;

    button.style.opacity =
        ".5";


    emailText.classList.remove(
        "flicker"
    );

    emailText.textContent =
        "GENERATING...";


    setConnection(
        false
    );


    try{

        const domains =
            await getDomains();


        currentDomain =
            domains[0];


        const login =
            generateLogin();


        const response =
            await apiFetch(
                `${API}/api/inbox`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        login,
                        domain:
                            currentDomain

                    })

                }
            );


        const data =
            await readJSON(
                response
            );


        if(!response.ok){

            throw new Error(
                apiError(
                    data,
                    response.status
                )
            );

        }


        if(
            !data.address ||
            !data.token
        ){

            throw new Error(
                "INVALID MAILBOX RESPONSE"
            );

        }


        currentEmail =
            data.address;

        token =
            data.token;


        localStorage.setItem(
            "tempmail_address",
            currentEmail
        );

        localStorage.setItem(
            "tempmail_token",
            token
        );

        localStorage.setItem(
            "tempmail_domain",
            currentDomain
        );


        /*
         * NEW MAILBOX = 5 MINUTES
         */

        localStorage.setItem(
            "tempmail_expiry",
            String(
                Date.now() +
                INITIAL_TIME
            )
        );


        messages = [];

        currentMessageId =
            null;


        resetOTP();

        renderMessages();


        emailText.textContent =
            currentEmail;


        startEmailFlicker();


        startLifetime();


        setConnection(
            true
        );


        showToast(
            "MAILBOX CONNECTED"
        );


        setTimeout(
            () => {

                refreshInbox(
                    false
                );

            },
            700
        );

    }


    catch(error){

        console.error(
            error
        );


        setConnection(
            false
        );


        emailText.classList.remove(
            "flicker"
        );


        emailText.textContent =
            "GENERATION FAILED";


        showToast(
            error.message ||
            "MAILBOX CREATION FAILED"
        );

    }


    finally{

        busy = false;

        button.disabled =
            false;

        button.style.opacity =
            "1";

    }

}

function restoreSession(){

            "tempmail_address"

    const savedToken =

            "tempmail_token"

    return true;

/* =====================================================
   TIMER
===================================================== */

function formatTimer(
    milliseconds
){

    const total =
        Math.max(
            0,
            Math.floor(
                milliseconds / 1000
            )
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const seconds =
        total % 60;


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(seconds)
            .padStart(2,"0")
    );

}


function startLifetime(){

    clearInterval(
        lifetimeTimer
    );


    let expiry =
        Number(
            localStorage.getItem(
                "tempmail_expiry"
            )
        );


    if(
        !expiry ||
        expiry <= Date.now()
    ){

        expiry =
            Date.now() +
            INITIAL_TIME;


        localStorage.setItem(
            "tempmail_expiry",
            String(expiry)
        );

    }


    function update(){

        const remaining =
            Math.max(
                0,
                expiry -
                Date.now()
            );


        timer.textContent =
            formatTimer(
                remaining
            );


        if(
            remaining <= 0
        ){

            clearInterval(
                lifetimeTimer
            );


            timer.textContent =
                "00:00";


            extendBtn.disabled =
                false;


            setConnection(
                false
            );


            showToast(
                "MAILBOX TIMER EXPIRED"
            );

        }

    }


    update();


    lifetimeTimer =
        setInterval(
            update,
            1000
        );

}

   EXTEND
===================================================== */

    () => {

        const expiry =

            EXTENDED_TIME;

            String(expiry)

        startLifetime();


        showToast(

        );

/* =====================================================
   REFRESH
===================================================== */

async function refreshInbox(
    manual = false
){

    if(
        !token ||
        busy
    ){

        return;

    }


    try{

        const response =
            await apiFetch(
                `${API}/api/messages`,
                {

                    headers:{
                        Authorization:
                            `Bearer ${token}`
                    }

                }
            );


        const data =
            await readJSON(
                response
            );


        if(
            response.status === 401
        ){

            setConnection(
                false
            );

            localStorage.removeItem(
                "tempmail_address"
            );

            localStorage.removeItem(
                "tempmail_token"
            );

            token = "";

            await createInbox();

            return;

        }


        if(!response.ok){

            setConnection(
                false
            );

            throw new Error(
                apiError(
                    data,
                    response.status
                )
            );

        }


        setConnection(
            true
        );


        messages =
            Array.isArray(data)
                ? data
                : [];


        renderMessages();


        if(messages.length){

            detectOTP(
                messages[0]
            );

        }


        if(manual){

            showToast(
                "INBOX SYNCHRONIZED"
            );

        }

    }


    catch(error){

        console.warn(
            error
        );


        setConnection(
            false
        );


        if(manual){

            showToast(
                "NETWORK ERROR"
            );

        }

    }

}

    try{

/* =====================================================
   SANITIZE EMAIL HTML
===================================================== */

/*
 * This function:
 *
 * 1. Removes javascript: URLs
 * 2. Removes dangerous event handlers
 * 3. Forces normal HTTP/HTTPS links
 *    to open in a NEW TAB
 * 4. Adds rel=noopener noreferrer
 *
 * Therefore:
 *
 * SIGN UP
 * VERIFY
 * ACTIVATE
 * REGISTER
 * CONFIRM
 * GET STARTED
 *
 * buttons/links can open normally.
 */

function prepareEmailHTML(
    html
){

    const parser =
        new DOMParser();


    const documentHTML =
        parser.parseFromString(
            String(html || ""),
            "text/html"
        );


    /*
     * Remove dangerous scripts
     */

    documentHTML
        .querySelectorAll(
            "script,iframe,object,embed,base,form"
        )
        .forEach(
            element =>
                element.remove()
        );


    /*
     * Remove inline event handlers
     */

    documentHTML
        .querySelectorAll("*")
        .forEach(
            element => {

                [...element.attributes]
                    .forEach(
                        attribute => {

                            if(
                                attribute.name
                                    .toLowerCase()
                                    .startsWith(
                                        "on"
                                    )
                            ){

                                element.removeAttribute(
                                    attribute.name
                                );

                            }

                        }
                    );

            }
        );


    /*
     * Process every link.
     */

    documentHTML
        .querySelectorAll(
            "a"
        )
        .forEach(
            link => {

                const href =
                    link.getAttribute(
                        "href"
                    );


                if(!href){

                    return;

                }


                const trimmed =
                    href.trim();


                /*
                 * Block dangerous URLs.
                 */

                if(
                    /^javascript:/i.test(
                        trimmed
                    ) ||
                    /^data:/i.test(
                        trimmed
                    ) ||
                    /^vbscript:/i.test(
                        trimmed
                    )
                ){

                    link.removeAttribute(
                        "href"
                    );

                    link.style.pointerEvents =
                        "none";

                    link.style.opacity =
                        ".5";

                    return;

                }


                /*
                 * Only allow web links.
                 *
                 * Relative links are resolved
                 * against the email document's
                 * base URL when possible.
                 */

                if(
                    /^https?:\/\//i.test(
                        trimmed
                    )
                ){

                    link.setAttribute(
                        "target",
                        "_blank"
                    );

                    link.setAttribute(
                        "rel",
                        "noopener noreferrer"
                    );

                }

            }
        );


    /*
     * Add a small helper script.
     *
     * This catches clicks even when an email
     * provider forgot target="_blank".
     */

    const script =
        documentHTML.createElement(
            "script"
        );


    script.textContent = `

        document.addEventListener(
            "click",
            function(event){

                const link =
                    event.target.closest("a");

                if(!link){

                    return;

                }

                const href =
                    link.href;

                if(!href){

                    return;

                }

                if(
                    !/^https?:\\\\/\\\\//i.test(
                        href
                    )
                ){

                    return;

                }

                event.preventDefault();

                window.open(
                    href,
                    "_blank",
                    "noopener,noreferrer"
                );

            },
            true
        );

    `;


    documentHTML.body.appendChild(
        script
    );


    return (
        "<!DOCTYPE html>" +
        documentHTML.documentElement.outerHTML
    );

}


/* =====================================================
   RENDER EMAIL BODY
===================================================== */

function renderBody(
    data
){

    const target =
        document.getElementById(
            "detailBody"
        );


    target.innerHTML =
        "";


    if(
        data.html &&
        String(data.html).trim()
    ){

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.className =
            "email-frame";


        /*
         * Do NOT use sandbox here.
         *
         * sandbox blocks normal popup/new-tab
         * behavior.
         *
         * The HTML is sanitized before insertion.
         */

        iframe.srcdoc =
            prepareEmailHTML(
                data.html
            );


        iframe.addEventListener(
            "load",
            () => {

                /*
                 * Extra protection:
                 * force every HTTP/HTTPS link
                 * to open in a new tab.
                 */

                try{

                    const doc =
                        iframe.contentDocument ||
                        iframe.contentWindow.document;


                    doc
                        .querySelectorAll(
                            "a"
                        )
                        .forEach(
                            link => {

                                const href =
                                    link.getAttribute(
                                        "href"
                                    );


                                if(
                                    href &&
                                    /^https?:\/\//i.test(
                                        href
                                    )
                                ){

                                    link.setAttribute(
                                        "target",
                                        "_blank"
                                    );

                                    link.setAttribute(
                                        "rel",
                                        "noopener noreferrer"
                                    );

                                }

                            }
                        );

                }

                catch(error){

                    console.warn(
                        "Email link processing:",
                        error
                    );

                }

            }
        );


        target.appendChild(
            iframe
        );

    }

    else{

        const pre =
            document.createElement(
                "pre"
            );


        pre.className =
            "text-body";


        pre.textContent =
            data.text ||
            "NO MESSAGE BODY";


        target.appendChild(
            pre
        );

    }

}

   CLEAR INBOX

async function clearInbox(){

    if(!token){

        return;

    }


    try{

        const response =
            await apiFetch(
                `${API}/api/inbox`,
                {

                    method:"DELETE",

                    headers:{
                        Authorization:
                            `Bearer ${token}`
                    }

                }
            );


        const data =
            await readJSON(
                response
            );


        if(!response.ok){

            throw new Error(
                apiError(
                    data,
                    response.status
                )
            );

        }


        messages = [];


        resetOTP();


        renderMessages();


        showToast(
            "INBOX PURGED"
        );

    }


    catch(error){

        showToast(
            error.message ||
            "PURGE FAILED"
        );

    }

}


/* =====================================================
   OTP
===================================================== */

function detectOTP(
    envelope
){

    if(!envelope){

        return;

    }


    const text =
        [
            envelope.subject || "",
            envelope.intro || ""
        ].join(" ");


    const code =
        extractOTP(
            text
        );


    if(code){

        showOTP(
            code,
            envelope.from ||
            "INCOMING"
        );

    }

}


function detectOTPInText(
    text,
    source
){

    const code =
        extractOTP(
            text
        );


    if(code){

        showOTP(
            code,
            source
        );

    }

}


function extractOTP(
    text
){

    if(!text){

        return null;

    }


    let match =
        String(text).match(
            /(?:otp|one[-\s]?time|verification|verify|code|passcode|pin)[^0-9]{0,80}(\d{4,8})/i
        );


    if(match){

        return match[1];

    }


    match =
        String(text).match(
            /\b(\d{6})\b/
        );


    if(match){

        return match[1];

    }


    match =
        String(text).match(
            /\b(\d{4,5})\b/
        );


    if(match){

        return match[1];

    }


    return null;

}

}

/* =====================================================
   HELPERS
===================================================== */

function getInitial(
    value
){

    return String(
        value || "?"
    )
    .trim()
    .charAt(0)
    .toUpperCase();

}


function formatDate(
    value
){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleString();

}


function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}


/* =====================================================
   POLLING
===================================================== */

function startPolling(){

    clearInterval(
        pollingTimer
    );


    pollingTimer =
        setInterval(
            () => {

                refreshInbox(
                    false
                );

            },
            POLL_INTERVAL
        );

}


/* =====================================================
   INIT
===================================================== */

async function init(){

    const restored =
        restoreSession();


    if(restored){

        startLifetime();


        await refreshInbox(
            false
        );

    }

    else{

        await createInbox();

    }


    startPolling();

}


init();


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        clearInterval(
            pollingTimer
        );

        clearInterval(
            lifetimeTimer
        );

    }
);
